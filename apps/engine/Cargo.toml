[package]
name = "rift-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["v8-isolate"]
v8-isolate = ["deno_core"]

[dependencies]
deno_core = { version = "0.311", optional = true }
aes-gcm = "0.10"
anyhow = "1"
async-trait = "0.1"
bytes = "1"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "json", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
instant-acme = "0.7"
hex = "0.4"
hickory-resolver = "0.25"
ipnet = "2"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
jsonwebtoken = "9"
once_cell = "1"
rcgen = "0.13"
rand = "0.8"
regex = "1"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
hmac = "0.12"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
time = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
lru = "0.12"
prometheus = { version = "0.13", features = ["process"] }
zeroize = "1"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"] }
serial_test = "3"
tempfile = "3"
