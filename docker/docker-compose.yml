services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rift
      POSTGRES_USER: rift
      POSTGRES_PASSWORD: rift
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rift -d rift"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      # Override DATABASE_URL to use the docker network hostname
      DATABASE_URL: postgres://rift:rift@db:5432/rift
    ports:
      - "3001:3001"
      - "8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_ADMIN
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp:size=1G,exec
      - /var/rift/builds:size=5G,exec
    volumes:
      - deployments:/var/rift/deployments
      - ssl:/var/rift/ssl
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  postgres_data:
  deployments:
  ssl:
