services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rift
      POSTGRES_USER: rift
      POSTGRES_PASSWORD: rift
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rift -d rift"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://rift:rift@db:5432/rift
      RIFT_STATE_STORE: ${RIFT_STATE_STORE:-redis}
      RIFT_REDIS_URL: ${RIFT_REDIS_URL:-redis://redis:6379}
      RIFT_ABUSE_ALLOWLIST_CIDRS: ${RIFT_ABUSE_ALLOWLIST_CIDRS:-}
      RIFT_ABUSE_BYPASS_TOKEN: ${RIFT_ABUSE_BYPASS_TOKEN:-}
      RIFT_ABUSE_BYPASS_HEADER: ${RIFT_ABUSE_BYPASS_HEADER:-x-rift-abuse-bypass}
      RIFT_ABUSE_CHALLENGE_TTL_SECS: ${RIFT_ABUSE_CHALLENGE_TTL_SECS:-900}
      RIFT_ABUSE_BOT_VERIFY: ${RIFT_ABUSE_BOT_VERIFY:-true}
      RIFT_ABUSE_BOT_VERIFY_CACHE_SECS: ${RIFT_ABUSE_BOT_VERIFY_CACHE_SECS:-600}
      RIFT_ABUSE_LIMIT_OVERRIDES_JSON: ${RIFT_ABUSE_LIMIT_OVERRIDES_JSON:-}
    ports:
      - "3001:3001"
      - "80:8080"
      - "443:8443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_ADMIN     # Required for namespace isolation (unshare) and cgroup management
      - NET_ADMIN      # Required for iptables firewall rules
    read_only: true
    tmpfs:
      - /tmp:size=5G,exec
      - /var/rift/builds:size=5G,exec
      - /var/rift/cache:size=10G
      - /root:size=3G,exec
      - /usr/local/share/.cache:size=5G
    volumes:
      - deployments:/var/rift/deployments
      - ssl:/var/rift/ssl
      # Mount cgroup v2 filesystem for worker pool resource limits
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup: host
    # Kernel sysctl hardening at container level
    sysctls:
      - net.ipv4.ip_forward=0
      - net.ipv4.conf.all.accept_redirects=0
      - net.ipv4.conf.default.accept_redirects=0
      - net.ipv4.tcp_syncookies=1
      - net.ipv4.conf.all.accept_source_route=0
      - net.ipv4.conf.all.rp_filter=1
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 8192

  frontend:
    build:
      context: ${RIFT_FRONTEND_CONTEXT:-../../frontend}
      dockerfile: ${RIFT_FRONTEND_DOCKERFILE:-Dockerfile}
    depends_on:
      - engine
    env_file:
      - ../.env
    environment:
      RIFT_ENGINE_URL: http://engine:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  deployments:
  ssl:
