services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rift
      POSTGRES_USER: rift
      POSTGRES_PASSWORD: rift
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rift -d rift"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://rift:rift@db:5432/rift
    ports:
      - "3001:3001"
      - "80:8080"
      - "443:8443"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SYS_ADMIN
      - NET_ADMIN
    read_only: true
    tmpfs:
      - /tmp:size=5G,exec
      - /var/rift/builds:size=5G,exec
      - /root:size=3G,exec
      - /usr/local/share/.cache:size=5G
    volumes:
      - deployments:/var/rift/deployments
      - ssl:/var/rift/ssl
      # Mount cgroup v2 filesystem for worker pool resource limits
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroup: host
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      - engine
    env_file:
      - ../.env
    environment:
      RIFT_ENGINE_URL: http://engine:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  deployments:
  ssl:
